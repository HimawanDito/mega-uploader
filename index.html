<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Mega Uploader</title>
  <link rel="stylesheet" href="style.css">

  <!-- MEGA JS BROWSER BUILD -->
  <script src="https://unpkg.com/megajs@0.19.0/dist/main.global.js"></script>

</head>
<body>

<div class="container">

  <h2>MEGA File Uploader</h2>

  <input type="email" id="email" placeholder="Email MEGA">
  <input type="password" id="password" placeholder="Password">

  <button id="loginBtn">Login</button>

  <select id="folderSelect"></select>

  <input type="file" id="fileInput" multiple>

  <button id="uploadBtn">Upload</button>

  <div id="progressArea"></div>

</div>

<script src="app.js"></script>
</body>
</html>
